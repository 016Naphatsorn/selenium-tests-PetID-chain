services:
  backend:
    build:
      context: ./backend
    container_name: petid-chain-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5001
    restart: unless-stopped

  frontend:
    build:
      context: .
    container_name: petid-chain-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped